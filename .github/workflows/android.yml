name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and check
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug
          mkdir -p build/rules-tests
          javac -encoding UTF-8 -d build/rules-tests app/src/main/java/tw/edu/ctust/ncdphone/Rules.java app/src/main/java/tw/edu/ctust/ncdphone/FlipDetector.java app/src/main/java/tw/edu/ctust/ncdphone/WeatherKind.java tests/RulesTest.java
          java -cp build/rules-tests tw.edu.ctust.ncdphone.RulesTest
      - uses: actions/upload-artifact@v4
        with:
          name: NCDPhone-debug
          path: app/build/outputs/apk/debug/app-debug.apk
  release:
    if: startsWith(github.ref, 'refs/tags/v') && vars.NCD_AUTO_RELEASE == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release
        env:
          KEYSTORE_BASE64: ${{ secrets.NCD_KEYSTORE_BASE64 }}
          NCD_STORE_PASSWORD: ${{ secrets.NCD_STORE_PASSWORD }}
          NCD_KEY_PASSWORD: ${{ secrets.NCD_KEY_PASSWORD }}
          NCD_KEY_ALIAS: ncdphone
          NCD_KEYSTORE: ${{ runner.temp }}/ncdphone.jks
        run: |
          test -n "$KEYSTORE_BASE64"
          VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '\r')
          test "$GITHUB_REF_NAME" = "v$VERSION"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$NCD_KEYSTORE"
          chmod +x gradlew
          ./gradlew assembleRelease lintRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/NCDPhone-$VERSION.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --prerelease --title "NCDPhone $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
